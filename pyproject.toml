[project]
name = "pihole-disable"
version = "2026.08.26"
requires-python = ">=3.13"
dependencies = [
    "quart>=0.20.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "requests>=2.33.1",
    "urllib3>=2.6.3",
    "hypercorn>=0.18.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-responses>=0.5.1",
    "pytest-sugar>=1.1.1",
    "ruff>=0.15.14",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"