[project]
name = "pihole-disable"
description = "A simple-to-use web interface for temporarily disabling a local Pi-hole DNS blocker."
version="2026.09.01"
license="MIT"
license-files = ["LICEN[CS]E*"]
requires-python = ">=3.13"
dependencies = [
    "hypercorn>=0.18.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "quart>=0.20.0",
    "requests>=2.33.1",
    "urllib3>=2.6.3",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pre-commit>=4.6.2",
    "ruff>=0.15.14",
    "tox>=4.60.1",
]
test = [
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-env>=1.6.0",
    "pytest-responses>=0.5.1",
    "pytest-sugar>=1.1.1",
]

[build-system]
requires = ["uv_build>=0.12.6,<0.13"]
build-backend = "uv_build"
