version: 1
formatters:
  simple:
    format: '[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S %z'
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
loggers:
  pihole_disable:
    level: INFO
    handlers: [console]