version: 1
formatters:
  simple:
    format: '[%(asctime)s] [%(name)s] [%(levelname)s] %(message)s'
    datefmt: '%Y-%m-%d %H:%M:%S %z'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: simple
    stream: ext://sys.stdout
  file:
    class: logging.FileHandler
    level: DEBUG
    formatter: simple
    filename: logs/.pihole-disable.log
loggers:
  pihole_disable:
    level: INFO
    handlers: [console, file]
